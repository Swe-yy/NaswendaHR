version: "3.9"

services:
  app: 
    build: 
      context: ..
      dockerfile: config/Dockerfile
    container_name: naswendahr
    ports:
      - "4200:4200"
    volumes:
      - ./src:/var/www/html
      - ../backend:/var/www/html/backend
    
    depends_on:
      - db

  backend: 
    image: php:8.3-apache
    container_name: hr_php
    restart: always
    volumes:
    - ../backend:/var/www/html

    ports:
      - "${PHP_PORT}:80"
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${DB}
      MYSQL_ROOT_PASSWORD: ${PASSWORD}

    depends_on:
      - db

  db: 
    image: mysql:5.7
    container_name: hr_db
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: ${DB}

    ports:
      - "${MYSQL_PORT}:3307"
    volumes:
      - db:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d
    
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hr_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
    depends_on:
      - db

volumes:
  db:
    
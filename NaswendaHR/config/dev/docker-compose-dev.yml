services:
  app:
    build:
      context: ../..
      dockerfile: ./config/Dockerfile
    container_name: naswendahr
    ports:
      - "4200:4200"
    volumes:
      - ../../src:/var/www/html
      
     
    depends_on:
      - db

  backend:
    build:
      context: ../../backend
      dockerfile: ../../NaswendaHR/backend/Dockerfile
    container_name: hr_api
    restart: always
    volumes:
      - ../../backend:/var/www/html
      - ../../vendor:/var/www/html/vendor
      - ./php.ini:/usr/local/etc/php/conf.d/99-overrides.ini
     
    ports:
      - "${PHP_PORT}:80"
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${DB}
      MYSQL_ROOT_PASSWORD: ${PASSWORD}

    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: hr_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: ${DB}

    ports:
      - "${MYSQL_PORT}:3307"
    volumes:
      - db:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/hr-schema.sql
      # - ../database/dev:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hr_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
    depends_on:
      - db

volumes:
  db:

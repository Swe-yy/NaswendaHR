services:
  app:
    build:
      context: ../..
      dockerfile: ./config/Dockerfile
    container_name: naswendahr
    ports:
      - "4200:4200"
    volumes:
      - ../../src:/var/www/html
      
     
    depends_on:
      - db

  backend:
    build:
      context: ../../backend
      dockerfile: ../../NaswendaHR/backend/Dockerfile
    container_name: hr_api
    restart: always
    volumes:
      - ../../backend:/var/www/html
      - ../../vendor:/var/www/html/vendor
      - ./php.ini:/usr/local/etc/php/conf.d/99-overrides.ini
     
    ports:
      - "${PHP_PORT}:80"
    environment:
      DB_HOST: db
      MARIADB_DATABASE: ${DB}
      MARIADB_ROOT_PASSWORD: ${PASSWORD}

    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: hr_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password1
      MARIADB_DATABASE: naswendaHR

    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/hr-schema.sql
      # - ../database/dev:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hr_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MARIADB_ROOT_PASSWORD: ${PASSWORD}
    depends_on:
      - db

  mongoDB:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports: 
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

volumes:
  db:
  mongodb:
    external: true


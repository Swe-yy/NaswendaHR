services:
  app:
    build:
      context: ../..
      dockerfile: ./config/Dockerfile
    container_name: naswendahr
    ports:
      - "4200:4200"
    volumes:
      - ../../src:/var/www/html
      
     
    depends_on:
      - db

  backend:
    build:
      context: ../../backend
      dockerfile: ../../NaswendaHR/backend/Dockerfile
    container_name: hr_api
    restart: always
    volumes:
      - ../../backend:/var/www/html
      - ../../vendor:/var/www/html/vendor
     
    ports:
      - "${PHP_PORT}:80"
    environment:
      DB_HOST: db
      MARIADB_DATABASE: ${DB}
      MARIADB_ROOT_PASSWORD: ${PASSWORD}

    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: hr_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password1
      MARIADB_DATABASE: naswendaHR

    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - db:/var/lib/mariadb
      - ../database/schema.sql:/docker-entrypoint-initdb.d/hr-schema.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hr_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MARIADB_ROOT_PASSWORD: ${PASSWORD}
    depends_on:
      - db

volumes:
  db:
  

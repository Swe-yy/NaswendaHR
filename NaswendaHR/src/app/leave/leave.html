<div class="body">
    <div class="upcoming">
        <h2>UPCOMING LEAVE</h2>
        <div class="dummy">
            <p class="title">[Title]</p>
            <p class="date">[Date]</p>
        </div>
        <div class="upcoming-leave" *ngFor="let l of upcomingLeave">
            <p class="title">{{l.title}}</p>
            <p class="date">{{l.date}}</p>
        </div>
    </div>
    <div class="pending">
        <h2>PENDING LEAVE REQUESTS</h2>
        <div class="dummy">
            <p class="title">[Title]</p>
            <p class="date">[Date]</p>
        </div>
        <div class="pending-leave" *ngFor="let l of pendingLeave">
            <p class="title">{{l.title}}</p>
            <p class="date">{{l.date}}</p>
        </div>
    </div>
    <div class="crud">
        <h2>ACTIONS</h2>
        <div id="create" class="crud-item">Request Leave</div>
        <div id="update" class="crud-item">Update Leave Request</div>
        <div id="delete" class="crud-item">Cancel Leave Request</div>
    </div>
</div>

<nav aria-label="Page navigation example">
    <ul class="pagination">
        <li *ngIf="currentPage() > 1" class="page-item" (click)="pageClicked(currentPage()-1)">
            <span aria-hidden="true">&laquo;</span>
            <span class="sr-only">Previous</span>
        </li>
        <li (click)="pageClicked(p)" *ngFor="let p of pageList" class="page-item">
            {{p}}
        </li>
        <li *ngIf="currentPage() < pages" class="page-item" (click)="pageClicked(currentPage()+1)">
            <span aria-hidden="true">&raquo;</span>
            <span class="sr-only">Next</span>
        </li>
    </ul>
</nav>

<nav aria-label="Page-navigation">
    <ul class="pagination">
        <li class="page-item" (click)="pageClicked(currentPage() - 1)">
            <span aria-hidden="true">&laquo;</span>
            <span class="sr-only">Previous</span>
        </li>
        <li (click)="pageClicked(p)" *ngFor="let p of pageList" class="page-item" [ngClass]="{active: p == currentPage()}">
            {{p}}
        </li>
        <li class="page-item" (click)="pageClicked(currentPage() + 1)">
            <span aria-hidden="true">&raquo;</span>
            <span class="sr-only">Next</span>
        </li>
    </ul>
</nav>

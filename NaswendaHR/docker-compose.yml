version: "3.9"

services:
 web: 
  build: 
    context: .
    dockerfile: dockerfile
  container_name: naswendahr
  ports:
    - "8082:80"
  volumes:
    - ./src:/var/www/html
  
  depends_on:
    - db

db: 
  image: mysql:5.7
  container_name: hr_db
  restart: always
  environment: 
    ROOT: ${ROOT}
    DATABASE: ${DB}


  ports:
    - "${MYSQL_PORT}:3307"
  volumes:
    - db:/var/lib/mysql
    

phpmyadmin:
  image: phpmyadmin/phpmyadmin
  container_name: hr_phpmyadmin
  restart: always
  ports:
    - "${PHPMYADMIN_PORT}:80"
  environment:
    PHPMA_HOST: db
    ROOT: ${ROOT}

  depends_on:
    - db

php: 
  image: php:8.3-apache
  container_name: hr_php
  restart: always
  volumes:
   - ./src/backend:/var/www/html
   - ./vendor:/var/www/html/vendor

  ports:
    - "${PHP_PORT}: 80"
  environment:
    DB_HOST: db
    DATABASE: ${DB}
    ROOT: ${ROOT}

  depends_on:
    - db 

volumes:
  db:
    
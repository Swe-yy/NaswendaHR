name: Frontend CI
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: npm
      - name: Install Dependencies 
        run: npm ci
      - name: Build
        run: npm run build
        
  unit-tests:
      runs-on: ubuntu-latest
      steps: 
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with: 
            node-version: 24
            cache: npm
        - run: npm ci
        
        - name: Run Unit Tests
          run: npm run test:frontend:unit
        - uses: actions/upload-artifact@v4
          if: failure()
          with: 
            name: unit-test-results
            path: coverage/

  integration-tests:
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:15
          env:
            POSTGRES_PASSWORD: ${{secrets.DB_PASSWORD}}
            POSTGRES_DB: test-db
            POSTGRES_USER: postgres
          ports: 
            - 5432:5432
      steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with: 
              node-version: 24
              cache: npm
          - run: npm ci
          
          - name: Run Integration Tests
            run: npm run test:frontend:integration
            env:
              DB_HOST: localhost
              DB_PORT: 5432
              DB_USERNAME: postgres
              DB_PASSWORD: ${{secrets.DB_PASSWORD}}
              DB_NAME: test-db
          - uses: actions/upload-artifact@v4
            if: failure()
            with: 
              name: integration-test-results
              path: coverage/
          
              
        
